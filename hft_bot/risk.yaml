# ---------------------------------------------------------------------------
# Hyperliquid HFT Bot — Risk Configuration
# Changes require a bot restart to take effect (no live hot-reload implemented).
# Tuned for a ~$160 account with 0.01 BTC position size.
# ---------------------------------------------------------------------------

# Maximum net BTC position (long OR short). Tracks order_size_btc — set to match.
max_inventory_btc: 0.001

# Hard stop-loss as a fraction of entry price.
# 0.005 = 0.5% → max loss per trade ≈ $0.38 on 0.001 BTC.
# Widened from 0.3%: BTC swings 0.3% within seconds, causing premature SL hits.
stop_loss_pct: 0.005

# Daily circuit breaker.
# $2.00 = ~5 full SL hits on 0.001 BTC — tight limit for min-size monitoring phase.
max_daily_loss_usd: 2.0

# Cross-margin leverage applied at startup.
leverage: 10
